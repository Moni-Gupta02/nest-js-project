# Optional nginx fix for staging-rms-api.delicut.ae
# Problem: auth_request (or proxy to Molt gateway) runs when clients send `Authorization`,
# which returns {"status":false,"message":"Please sign in to continue"} for kitchen JWTs.
#
# Option A — skip external auth for vendor-kitchen (kitchen PermissionsGuard validates JWT):
#   location /api/vendor-kitchen/ {
#     proxy_pass http://127.0.0.1:4002;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#   }
#
# Option B — until nginx is updated, clients must send:
#   access-token: Bearer <userkms_jwt>
#   and must NOT send Authorization.
